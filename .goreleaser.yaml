version: 2
project_name: edgemap
# The release workflow runs scripts/licenses.sh in its own step, without secrets,
# and passes --skip=before. Local snapshots generate the notices here.
before:
  hooks:
    - bash scripts/licenses.sh
builds:
  - main: ./cmd/edgemap
    binary: edgemap
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -buildid=
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed mtimes keep archives and checksums.txt identical across rebuilds.
    files:
      - src: LICENSE
        info: {mtime: '{{ .CommitDate }}'}
      - src: README.md
        info: {mtime: '{{ .CommitDate }}'}
      # **/* does not match files directly under THIRD_PARTY_LICENSES.
      - src: THIRD_PARTY_LICENSES/SOURCES.md
        info: {mtime: '{{ .CommitDate }}'}
      - src: THIRD_PARTY_LICENSES/**/*
        info: {mtime: '{{ .CommitDate }}'}
checksum:
  name_template: checksums.txt

release:
  prerelease: auto
homebrew_casks:
  - name: edgemap
    repository:
      owner: Infraedgecloud-tools
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/Infraedgecloud-tools/edgemap
    description: Static Terraform architecture diagrams without cloud credentials
    # Release candidates never update the public tap; the workflow smoke-tests
    # their generated cask from a local tap instead.
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/edgemap"]
          end
