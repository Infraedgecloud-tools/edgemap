version: 2
project_name: edgemap
before:
  hooks:
    - bash scripts/licenses.sh
builds:
  - main: ./cmd/edgemap
    binary: edgemap
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -buildid=
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, THIRD_PARTY_LICENSES/**/*]
checksum:
  name_template: checksums.txt

release:
  prerelease: auto
homebrew_casks:
  - name: edgemap
    repository:
      owner: Infraedgecloud-tools
      name: homebrew-tap
      token: '{{ .Env.TAP_TOKEN }}'
    directory: Casks
    homepage: https://github.com/Infraedgecloud-tools/edgemap
    description: Static Terraform architecture diagrams without cloud credentials
    skip_upload: false
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/edgemap"]
          end
